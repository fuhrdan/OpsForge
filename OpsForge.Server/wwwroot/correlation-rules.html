<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpsForge Correlation Rule Designer</title>
<style>body{font-family:system-ui,Segoe UI,sans-serif;background:#111827;color:#e5e7eb;margin:0;padding:24px}main{max-width:1100px;margin:auto}.card{background:#1f2937;border:1px solid #374151;border-radius:10px;padding:18px;margin:14px 0}textarea,input{width:100%;box-sizing:border-box;background:#0f172a;color:#e5e7eb;border:1px solid #475569;border-radius:6px;padding:9px}textarea{min-height:320px;font-family:Consolas,monospace}button{padding:9px 14px;margin:5px 5px 5px 0;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;background:#0f172a;padding:12px;border-radius:6px}.muted{color:#9ca3af}</style></head>
<body><main><h1>Correlation Rule Designer</h1><p class="muted">Draft → validate → dry-run → explicitly activate. Preview never changes live correlation.</p>
<div class="card"><button onclick="loadRules()">Load active rules</button><button onclick="validateRules()">Validate draft</button><button onclick="exportRules()">Export active rules</button><label>Agent ID for dry-run</label><input id="agentId" placeholder="smoke-01"><button onclick="previewRules()">Dry-run against agent</button><textarea id="rules"></textarea></div>
<div class="card"><label>Activation note</label><input id="note" placeholder="Explain why this rule set is being activated"><button onclick="activateRules()">Activate draft</button><button onclick="loadHistory()">Show history</button></div><div class="card"><pre id="output">Authenticate in OpsForge first, then load active rules.</pre></div></main>
<script>
const out=document.getElementById('output');function csrf(){return sessionStorage.getItem('opsforgeCsrf')||localStorage.getItem('opsforgeCsrf')||''}async function req(url,o={}){o.credentials='same-origin';o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});if(o.method&&o.method!=='GET')o.headers['X-OpsForge-CSRF']=csrf();const r=await fetch(url,o),t=await r.text();let b;try{b=JSON.parse(t)}catch{b=t}if(!r.ok)throw new Error(typeof b==='string'?b:JSON.stringify(b,null,2));return b}function draft(){return JSON.parse(document.getElementById('rules').value||'[]')}
async function loadRules(){try{const x=await req('/api/correlation-rules');document.getElementById('rules').value=JSON.stringify(x,null,2);out.textContent='Loaded active rules.'}catch(e){out.textContent=e}}
async function validateRules(){try{out.textContent=JSON.stringify(await req('/api/correlation-rules/validate',{method:'POST',body:JSON.stringify({rules:draft()})}),null,2)}catch(e){out.textContent=e}}
async function previewRules(){try{out.textContent=JSON.stringify(await req('/api/correlation-rules/preview',{method:'POST',body:JSON.stringify({agentId:document.getElementById('agentId').value,rules:draft()})}),null,2)}catch(e){out.textContent=e}}
async function activateRules(){try{out.textContent=JSON.stringify(await req('/api/correlation-rules/import',{method:'POST',body:JSON.stringify({rules:draft(),note:document.getElementById('note').value})}),null,2)}catch(e){out.textContent=e}}
async function loadHistory(){try{out.textContent=JSON.stringify(await req('/api/correlation-rules/history'),null,2)}catch(e){out.textContent=e}}
async function exportRules(){try{const x=await req('/api/correlation-rules/export');const b=new Blob([JSON.stringify(x,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='opsforge-correlation-rules.json';a.click();URL.revokeObjectURL(a.href)}catch(e){out.textContent=e}}
</script></body></html>
